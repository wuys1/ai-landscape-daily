name: AI Landscape Daily

on:
  schedule:
    # GitHub Actions cron uses UTC. This runs at 09:07 Asia/Shanghai.
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date, for example 2026-06-28 or today"
        required: false
        default: "today"
      send_email:
        description: "Send email after generation"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Generate report
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_TIMEOUT_SECONDS: ${{ secrets.LLM_TIMEOUT_SECONDS }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          SEND_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.send_email }}" = "true" ]; then
            SEND_FLAG="--send"
          fi
          python -m ai_landscape_daily generate \
            --date "${{ inputs.report_date || 'today' }}" \
            --output-dir site \
            --db data/ai_daily.sqlite3 \
            $SEND_FLAG

      - name: Deploy static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch site/.nojekyll
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/ai-landscape-daily-pages
          mkdir -p /tmp/ai-landscape-daily-pages
          cp -R site/. /tmp/ai-landscape-daily-pages/
          cd /tmp/ai-landscape-daily-pages
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy AI daily site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-landscape-sqlite
          path: data/ai_daily.sqlite3
          if-no-files-found: ignore
